services:
  - type: web
    name: citywatcher-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: citywatcher-db
          property: connectionString

databases:
  - name: citywatcher-db
    databaseName: citywatcher
    user: citywatcher
